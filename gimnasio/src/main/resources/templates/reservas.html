<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reservas</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2><i class="fa-solid fa-dumbbell"></i> FitPower</h2>
    <div>
        <span>Bienvenido, <b th:text="${usuario.nombre}"></b></span>
        <a href="/resenas"><i class="fa-solid fa-star"></i> Reseñas</a>
        <a class="logout" href="/logout">Cerrar sesión</a>
    </div>
</div>

<!-- FORMULARIO -->
<div class="hero">
    <div class="card">
        <h2><i class="fa-solid fa-calendar-check"></i> Reservar clase</h2>
        <p>Elige actividad, fecha, hora y valora la experiencia.</p>

        <form action="/reservas/guardar" method="post" th:object="${reserva}">

            <input type="text" th:field="*{actividad}" placeholder="Actividad" required>

            <input type="date" th:field="*{fecha}" required>

            <input type="time" th:field="*{hora}" required>

            <!-- ⭐ PUNTUACIÓN -->
            <label>Puntuación:</label>
            <select th:field="*{puntuacion}">
                <option value="5">★★★★★</option>
                <option value="4">★★★★☆</option>
                <option value="3">★★★☆☆</option>
                <option value="2">★★☆☆☆</option>
                <option value="1">★☆☆☆☆</option>
            </select>

            <button type="submit">Reservar</button>
        </form>
    </div>
</div>

<!-- TABLA -->
<div class="table-container">
    <h2><i class="fa-solid fa-list"></i> Mis reservas</h2>

    <table>
        <tr>
            <th>Actividad</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Puntuación</th>
            <th>Acción</th>
        </tr>

        <tr th:each="r : ${reservas}">
            <td th:text="${r.actividad}"></td>
            <td th:text="${r.fecha}"></td>
            <td th:text="${r.hora}"></td>

            <!-- ⭐ MOSTRAR ESTRELLAS -->
            <td>
                <span th:each="i : ${#numbers.sequence(1, r.puntuacion)}">★</span>
            </td>

            <td>
                <a th:href="@{'/reservas/cancelar/' + ${r.idReserva}}">
                    <i class="fa-solid fa-trash"></i> Cancelar
                </a>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
