<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Registro</title>
</head>
<body>
<div class="hero">
    <div class="card">
        <h2>Crear cuenta</h2>
        <p>Regístrate para empezar a reservar clases.</p>

        <form action="/registro" method="post" th:object="${usuario}">
            <input type="text" th:field="*{nombre}" placeholder="Nombre" required>
            <input type="email" th:field="*{email}" placeholder="Correo electrónico" required>
            <input type="password" th:field="*{password}" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>

        <a href="/login">Ya tengo cuenta</a>
    </div>
</div>

</body>
</html>
