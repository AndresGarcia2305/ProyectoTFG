<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="hero">
    <div class="card">

        <img src="/img/logo.png" alt="Logo" style="width:90px; margin-bottom:15px;">

        <h2>Registro</h2>

        <form action="/registro" method="post" th:object="${usuario}">
            <input type="text" th:field="*{nombre}" placeholder="Nombre" required>
            <input type="email" th:field="*{email}" placeholder="Correo" required>
            <input type="password" th:field="*{password}" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>

        <a href="/login">Ya tengo cuenta</a>
    </div>
</div>

</body>
</html>
